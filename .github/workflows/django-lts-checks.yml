name: Isolated Django security checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: 'sqlite:///:memory:'
      CLOUDINARY_CLOUD_NAME: ci-test
      CLOUDINARY_API_KEY: '123456'
      CLOUDINARY_API_SECRET: ci-test
      STRIPE_PUBLIC_KEY: ci-test
      STRIPE_SECRET_KEY: ci-test
      STRIPE_WH_SECRET: ci-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py check --settings=security_test_settings
      - name: Run migrations and request regressions on a disposable in-memory database
        run: python manage.py test security_tests --settings=security_test_settings -v 2
